<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>conseqa playground</title>
    <meta
      name="description"
      content="Write Conseqa models in YAML, validate them, run the model checker, and explore the interactive visualization — entirely in the browser."
    />
    <script>
      // Applying the stored colour mode before first paint, so the page
      // never flashes the other one. Light is the default; only an
      // explicit dark choice marks the root.
      try {
        if (localStorage.getItem("conseqa-playground-theme") === "dark") {
          document.documentElement.setAttribute("data-mode", "dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
