[package]
name = "conseqa-wasm"
version = "0.1.0"
edition = "2024"
description = "conseqa's parser, analyzer, model checker, and viz graph extraction compiled to WebAssembly for the browser demo"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The conseqa source itself, vendored as a git submodule. The parser,
# validator, model checker, report builder, and viz extractors are used
# unchanged. Default features off: they pull in the confluence server
# stack (tokio, axum, redb), which neither compiles to wasm32 nor
# belongs in the browser — the lean checker is the whole point here.
conseqa = { path = "../vendor/conseqa", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same YAML crate conseqa uses, needed to read error locations.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-pack's bundled wasm-opt predates the bulk-memory features modern
# rustc targets; `npm run build:wasm` runs a current one from binaryen.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
